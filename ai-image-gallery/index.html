<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Gallery - Vetrina Creativa</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">
                <i class="fas fa-magic"></i>
                AI Gallery
            </h1>
            <nav class="nav">
                <button class="nav-btn active" data-category="all">
                    <i class="fas fa-th"></i>
                    All
                </button>
                <button class="nav-btn" data-category="fashion">
                    <i class="fas fa-tshirt"></i>
                    Fashion
                </button>
                <button class="nav-btn" data-category="grim-reaper">
                    <i class="fas fa-skull"></i>
                    Grim Reaper
                </button>
                <button class="nav-btn" data-category="characters">
                    <i class="fas fa-users"></i>
                    Characters
                </button>
                <button class="nav-btn" data-category="storyline">
                    <i class="fas fa-book"></i>
                    Storyline
                </button>
                <button class="nav-btn" data-category="videos">
                    <i class="fas fa-video"></i>
                    Videos
                </button>
                <button class="nav-btn" data-category="logos">
                    <i class="fas fa-palette"></i>
                    Loghi
                </button>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <section class="hero">
                <h2 class="hero-title">AI Creations Gallery</h2>
                <p class="hero-description">
                    Explore a collection of images generated with artificial intelligence.
                    Each creation showcases modern AI creativity and innovation.
                </p>
            </section>

            <section class="gallery-section">
                <div class="gallery-controls">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search images...">
                    </div>
                    <div class="view-controls">
                        <button class="view-btn active" data-view="grid">
                            <i class="fas fa-th"></i>
                        </button>
                        <button class="view-btn" data-view="masonry">
                            <i class="fas fa-th-large"></i>
                        </button>
                    </div>
                </div>

                <div class="loading" id="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading gallery...</p>
                </div>

                <div class="gallery" id="gallery">
                    <!-- Le immagini verranno caricate dinamicamente -->
                </div>

                <div class="no-results" id="noResults" style="display: none;">
                    <i class="fas fa-search"></i>
                    <h3>No results found</h3>
                    <p>Try changing your search terms</p>
                </div>
            </section>
        </div>
    </main>

    <!-- Modal per visualizzazione ingrandita -->
    <div class="modal" id="imageModal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">
                <i class="fas fa-times"></i>
            </button>
            <img class="modal-image" id="modalImage" src="" alt="">
            <video class="modal-video" id="modalVideo" src="" controls style="display: none;"></video>
            <div class="modal-info">
                <h3 class="modal-title" id="modalTitle"></h3>
                <p class="modal-category" id="modalCategory"></p>
                <div class="modal-actions">
                    <button class="modal-btn" id="downloadBtn">
                        <i class="fas fa-download"></i>
                        Download
                    </button>
                    <button class="modal-btn" id="shareBtn">
                        <i class="fas fa-share"></i>
                        Share
                    </button>
                </div>
            </div>
            <div class="modal-navigation">
                <button class="modal-nav-btn" id="prevBtn">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button class="modal-nav-btn" id="nextBtn">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 AI Image Gallery. Powered by Creative Intelligence.</p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="demo.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
